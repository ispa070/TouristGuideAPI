<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Slet attraktion</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="icon" type="image/x-icon" th:href="@{/images/naeve.png}">
</head>

<body>

<header>
  <h1>Næveklubbens turistguide</h1>
</header>

<div th:replace="~{fragments :: navbar}"></div>

<main>

  <section class="delete-confirmation">

    <h2>Bekræft sletning</h2>

    <p>
      Vil du fjerne
      <strong th:text="${attraction.name}"></strong>
      permanent?
    </p>

    <p class="delete-warning">
      OBS! Dette kan ikke fortrydes.
    </p>

    <div class="delete-actions">

      <form method="post"
            th:action="@{/attractions/{name}/delete(name=${attraction.name})}">

        <button class="btn-delete" type="submit">
          Ja
        </button>

      </form>

      <a class="btn-cancel"
         th:href="@{/attractions}">
        Nej, gå tilbage
      </a>

    </div>

  </section>

</main>

<footer>
  <p>&copy; 2026 Næveklubben</p>
</footer>

</body>
</html>
